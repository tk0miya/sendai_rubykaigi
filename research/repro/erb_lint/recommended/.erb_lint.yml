---
# Rubocop linter only, with the cops disabled as recommended in erb_lint's README.
EnableDefaultLinters: false
linters:
  Rubocop:
    enabled: true
    rubocop_config:
      AllCops:
        NewCops: enable
        SuggestExtensions: false
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      # Rails/OutputSafety is also recommended, but omitted because this
      # repro does not install rubocop-rails.
